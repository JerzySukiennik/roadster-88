<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roadster 88</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111'/%3E%3Ctext x='16' y='22' font-family='Helvetica' font-size='15' font-weight='700' fill='%23fff' text-anchor='middle'%3E88%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
    "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.21.0/dist/rapier.mjs"
  }
}
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud" class="hud">
  <div class="hud-speed"><div id="speed" class="digits"></div><div id="tc" class="tc"><svg viewBox="0 0 44 44"><circle class="tc-track" cx="22" cy="22" r="19"/><circle id="tcArc" class="tc-arc" cx="22" cy="22" r="19"/></svg><div id="tcYear" class="tc-year"></div></div></div>
  <div class="hud-dots" id="dots"></div>
</div>
<div id="gaze" class="gaze"></div>
<div id="flash" class="flash"></div>
<div id="hint" class="hint"></div>
<div id="loading" class="loading"><div class="ld-title">Roadster 88</div><div class="ld-bar"><div id="ldBar"></div></div><div id="ldText" class="ld-text">Loading</div></div>
<div id="pause" class="pause hidden">
  <div class="pause-card">
    <div class="pause-head"><div class="pause-title">Roadster 88</div><div class="pause-sub" id="pauseSub"></div></div>
    <div class="pause-row"><span>Quality</span><div class="seg" id="quality"></div></div>
    <div class="pause-row"><span>Flight assist</span><div class="seg" id="assistSeg"></div></div>
    <div class="pause-row"><span>Paint</span><div class="seg" id="paintSeg"></div></div>
    <div class="pause-row"><span>Targa roof</span><div class="seg" id="roofSeg"></div><span>Wing</span><div class="seg" id="wingSeg"></div></div>
    <div class="keys" id="keys"></div>
    <div class="pause-foot"><button id="resume" class="btn">Resume</button></div>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
