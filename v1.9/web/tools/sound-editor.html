<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dźwięk silnika</title>
<style>
:root { --bg: #0b0c0f; --panel: rgba(255, 255, 255, 0.045); --line: rgba(255, 255, 255, 0.1); --ink: rgba(255, 255, 255, 0.92); --dim: rgba(255, 255, 255, 0.5); --amber: #ffb648; --font: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Arial, sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; background: radial-gradient(1200px 600px at 20% -10%, #1b1d24 0%, var(--bg) 60%); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; min-height: 100vh; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 32px 20px 60px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
.sub { margin-top: 4px; font-size: 13px; color: var(--dim); }
.btn { appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: 500 14px var(--font); padding: 10px 16px; border-radius: 12px; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; }
.btn:hover { background: rgba(255, 255, 255, 0.09); }
.btn:active { transform: scale(0.98); }
.btn.on, .btn.primary { background: rgba(255, 182, 72, 0.16); border-color: rgba(255, 182, 72, 0.55); }
.play { width: 64px; height: 64px; border-radius: 50%; font-size: 22px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; margin-top: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; }
.card h2 { margin: 0 0 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: var(--amber); }
.ctl { display: grid; grid-template-columns: 128px 1fr 74px; align-items: center; gap: 10px; margin: 9px 0; font-size: 13px; }
.ctl label { color: var(--dim); }
.ctl output { text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; }
input[type=range] { width: 100%; accent-color: var(--amber); }
.drive { margin-top: 18px; display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.speed { font-size: 46px; font-weight: 300; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.speed small { font-size: 14px; color: var(--dim); margin-left: 6px; }
.meter { height: 6px; background: rgba(255, 255, 255, 0.08); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.meter i { display: block; height: 100%; width: 0; background: var(--amber); border-radius: 3px; transition: width 0.08s linear; }
.tone { display: grid; grid-template-columns: 22px 1fr 1fr 64px 26px; gap: 8px; align-items: center; margin: 7px 0; font-size: 12px; }
.tone .n { color: var(--dim); }
.tone output { font-variant-numeric: tabular-nums; text-align: right; color: var(--ink); }
.x { appearance: none; border: 0; background: transparent; color: var(--dim); font-size: 16px; cursor: pointer; }
.x:hover { color: var(--ink); }
.status { font-size: 13px; color: var(--dim); min-height: 18px; }
.status.ok { color: var(--amber); }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--dim); margin-top: 8px; }
footer { margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
@media (max-width: 560px) { .ctl { grid-template-columns: 100px 1fr 60px; } .speed { font-size: 36px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Dźwięk silnika</h1><div class="sub">Roadster 88 · ten sam syntezator co w grze · „Zapisz w grze” od razu zmienia dźwięk w otwartej grze</div></div>
    <div class="row" id="presets"></div>
  </header>

  <div class="card drive">
    <button class="btn play" id="play" title="Graj / stop">▶</button>
    <div>
      <div class="row" style="justify-content: space-between;">
        <div class="speed"><span id="kmh">0</span><small>km/h</small></div>
        <div class="row">
          <button class="btn" id="gas">Gaz</button>
          <button class="btn" id="fly">W locie</button>
          <button class="btn on" id="demo">Demo jazdy</button>
        </div>
      </div>
      <input type="range" id="speed" min="0" max="250" value="0" step="1">
      <div class="meter"><i id="meter"></i></div>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h2>Tony</h2>
      <div id="tones"></div>
      <div class="row" style="margin-top: 10px;"><button class="btn" id="addTone">+ ton</button><button class="btn" id="down">− półton</button><button class="btn" id="up">+ półton</button><button class="btn" id="octDown">− oktawa</button><button class="btn" id="octUp">+ oktawa</button></div>
    </div>
    <div class="card"><h2>Barwa</h2><div id="g-tone"></div></div>
    <div class="card"><h2>Przestrzeń i ruch</h2><div id="g-space"></div></div>
    <div class="card"><h2>Głośność podczas jazdy</h2><div id="g-vol"></div><label class="check"><input type="checkbox" id="airMute"> Cisza w locie</label></div>
  </div>

  <footer>
    <button class="btn primary" id="save">Zapisz w grze</button>
    <button class="btn" id="load">Wczytaj z gry</button>
    <button class="btn" id="copy">Kopiuj ustawienia</button>
    <span class="status" id="status"></span>
  </footer>
</div>
<script type="module">
import { MotorSynth, MOTOR_PRESETS, cleanMotor } from '../src/motorSound.js';

const $ = (id) => document.getElementById(id);
const NOTES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const noteName = (f) => { const m = Math.round(69 + 12 * Math.log2(f / 440)); return NOTES[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1); };
let P = cleanMotor(JSON.parse(localStorage.getItem('r88.motorSound') || 'null') || MOTOR_PRESETS.muted);
let ctx = null, synth = null, master = null, playing = false, demo = true, gas = false, fly = false, rebuildT = 0;

const CTLS = {
  'g-tone': [['wave', 'Sinus → trójkąt', 0, 1, 0.01, (v) => Math.round(v * 100) + '%'], ['detune', 'Rozstrojenie', 0, 40, 0.5, (v) => v.toFixed(1) + ' ct'], ['cutoff', 'Filtr (jasność)', 200, 9000, 1, (v) => Math.round(v) + ' Hz', true], ['q', 'Rezonans', 0.1, 10, 0.05, (v) => v.toFixed(2)], ['pitch', 'Wysokość z prędkością', 0, 3, 0.01, (v) => '+' + Math.round(v * 100) + '%'], ['noise', 'Szum powietrza', 0, 0.3, 0.005, (v) => Math.round(v * 333) + '%'], ['noiseTone', 'Barwa szumu', 150, 8000, 1, (v) => Math.round(v) + ' Hz', true]],
  'g-space': [['echo', 'Echo / pogłos', 0, 0.8, 0.01, (v) => Math.round(v * 100) + '%'], ['feedback', 'Długość echa', 0, 0.8, 0.01, (v) => Math.round(v * 100) + '%'], ['shimmer', 'Falowanie', 0, 0.5, 0.005, (v) => Math.round(v * 200) + '%'], ['shimmerHz', 'Tempo falowania', 0.05, 12, 0.01, (v) => v.toFixed(2) + ' Hz', true]],
  'g-vol': [['idle', 'Przy ruszaniu', 0, 0.3, 0.002, (v) => Math.round(v * 300) + '%'], ['top', 'Przy pełnej prędkości', 0, 0.4, 0.002, (v) => Math.round(v * 250) + '%'], ['topSpeed', 'Pełna głośność od', 5, 100, 1, (v) => Math.round(v * 3.6) + ' km/h'], ['throttle', 'Dodatek przy gazie', 0, 0.3, 0.002, (v) => Math.round(v * 333) + '%'], ['gain', 'Głośność całości', 0, 3, 0.01, (v) => Math.round(v * 100) + '%']],
};
const toS = (v, log, a, b) => (log ? Math.log(v / a) / Math.log(b / a) * 1000 : v);
const fromS = (s, log, a, b) => (log ? a * Math.pow(b / a, s / 1000) : +s);
const inputs = {};
for (const [box, list] of Object.entries(CTLS)) for (const [k, label, a, b, step, fmt, log] of list) {
  const d = document.createElement('div'); d.className = 'ctl';
  d.innerHTML = `<label>${label}</label><input type="range"><output></output>`;
  const r = d.querySelector('input'), o = d.querySelector('output');
  r.min = log ? 0 : a; r.max = log ? 1000 : b; r.step = log ? 1 : step;
  r.oninput = () => { P[k] = fromS(r.value, log, a, b); o.textContent = fmt(P[k]); changed(); };
  inputs[k] = { r, o, fmt, log, a, b };
  $(box).appendChild(d);
}
$('airMute').onchange = () => { P.airMute = $('airMute').checked; changed(); };

function renderTones() {
  const box = $('tones'); box.innerHTML = '';
  P.tones.forEach((t, i) => {
    const d = document.createElement('div'); d.className = 'tone';
    d.innerHTML = `<span class="n">${i + 1}</span><input type="range" min="0" max="1000" title="Wysokość"><input type="range" min="0" max="0.5" step="0.005" title="Głośność"><output></output><button class="x" title="Usuń">×</button>`;
    const [fr, ar] = d.querySelectorAll('input'), o = d.querySelector('output');
    const show = () => { o.textContent = `${noteName(t[0])} ${Math.round(t[0])}`; };
    fr.value = toS(t[0], true, 30, 2000); ar.value = t[1]; show();
    fr.oninput = () => { t[0] = fromS(fr.value, true, 30, 2000); show(); changed(); };
    ar.oninput = () => { t[1] = +ar.value; changed(); };
    d.querySelector('.x').onclick = () => { if (P.tones.length > 1) { P.tones.splice(i, 1); renderTones(); changed(); } };
    box.appendChild(d);
  });
}

function renderAll() {
  for (const [k, c] of Object.entries(inputs)) { c.r.value = toS(P[k], c.log, c.a, c.b); c.o.textContent = c.fmt(P[k]); }
  $('airMute').checked = P.airMute; renderTones();
  for (const b of $('presets').children) b.classList.toggle('on', b.dataset.k && MOTOR_PRESETS[b.dataset.k].name === P.name);
}

function changed() {
  P.name = 'Mój';
  for (const b of $('presets').children) b.classList.remove('on');
  clearTimeout(rebuildT);
  rebuildT = setTimeout(() => { if (!synth) return; synth.bus.gain.setTargetAtTime(0, ctx.currentTime, 0.01); setTimeout(() => synth.set(P), 30); }, 70);
  status('');
}

for (const [k, pr] of Object.entries(MOTOR_PRESETS)) {
  const b = document.createElement('button'); b.className = 'btn'; b.textContent = pr.name; b.dataset.k = k;
  b.onclick = () => { P = cleanMotor(JSON.parse(JSON.stringify(pr))); renderAll(); if (synth) synth.set(P); status(''); b.classList.add('on'); };
  $('presets').appendChild(b);
}
const shift = (semis) => { const k = Math.pow(2, semis / 12); P.tones.forEach((t) => { t[0] = Math.max(30, Math.min(2000, t[0] * k)); }); renderTones(); changed(); };
$('up').onclick = () => shift(1); $('down').onclick = () => shift(-1); $('octUp').onclick = () => shift(12); $('octDown').onclick = () => shift(-12);
$('addTone').onclick = () => { if (P.tones.length < 8) { const last = P.tones[P.tones.length - 1]; P.tones.push([Math.min(2000, last[0] * 1.5), 0.08]); renderTones(); changed(); } };

$('play').onclick = async () => {
  if (!ctx) { ctx = new AudioContext(); master = ctx.createGain(); master.gain.value = 0.9; const comp = ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination); synth = new MotorSynth(ctx, master, P); }
  playing = !playing;
  if (playing) { await ctx.resume(); $('play').textContent = '❚❚'; } else { await ctx.suspend(); $('play').textContent = '▶'; }
};
$('demo').onclick = () => { demo = !demo; $('demo').classList.toggle('on', demo); };
$('gas').onclick = () => { gas = !gas; $('gas').classList.toggle('on', gas); };
$('fly').onclick = () => { fly = !fly; $('fly').classList.toggle('on', fly); };
$('speed').oninput = () => { demo = false; $('demo').classList.remove('on'); };

function status(t, ok) { $('status').textContent = t; $('status').classList.toggle('ok', !!ok); }
$('save').onclick = async () => {
  const j = cleanMotor(P);
  localStorage.setItem('r88.motorSound', JSON.stringify(j));
  try { new BroadcastChannel('r88-motor').postMessage(j); } catch (e) { /* no channel */ }
  try { const r = await fetch('/__motor-sound', { method: 'POST', body: JSON.stringify(j) }); status(r.ok ? 'Zapisane. Gra używa teraz tego dźwięku (także po odświeżeniu).' : 'Zapisane w przeglądarce (serwer nie przyjął pliku).', true); }
  catch (e) { status('Zapisane w przeglądarce.', true); }
};
$('load').onclick = async () => {
  try { const r = await fetch('../../assets/audio/motor-sound.json', { cache: 'no-store' }); if (!r.ok) throw 0; P = cleanMotor(await r.json()); renderAll(); if (synth) synth.set(P); status('Wczytane ustawienia z gry.', true); }
  catch (e) { status('Gra nie ma jeszcze zapisanych ustawień, używa domyślnych.'); }
};
$('copy').onclick = async () => { await navigator.clipboard.writeText(JSON.stringify(cleanMotor(P))); status('Skopiowane do schowka.', true); };

let last = performance.now(), dT = 0, v = 0;
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  let load = gas ? 1 : 0, air = fly;
  if (demo) {
    dT = (dT + dt) % 18;
    if (dT < 1.5) { v = 0; load = 0; air = false; }
    else if (dT < 9) { v = Math.min(55, v + dt * 7.3); load = 1; air = false; }
    else if (dT < 12) { load = 0.2; air = false; }
    else if (dT < 14) { air = true; load = 0; }
    else { v = Math.max(0, v - dt * 14); load = 0; air = false; }
    $('speed').value = Math.round(v * 3.6);
  } else v = $('speed').value / 3.6;
  $('kmh').textContent = Math.round(v * 3.6);
  $('fly').classList.toggle('on', air);
  if (synth && playing) { synth.update(dt, v, load, air ? 0 : 4, 1); $('meter').style.width = Math.min(100, synth.level / 0.35 * 100) + '%'; }
  requestAnimationFrame(loop);
}
renderAll(); requestAnimationFrame(loop);
</script>
</body>
</html>
